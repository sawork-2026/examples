server.port=8080

# Chat: OpenAI 兼容接口（Qwen / DeepSeek / GPT 均可）
spring.ai.openai.api-key=${LLM_API_KEY}
# 注意：Spring AI 会自动拼 /v1/chat/completions，所以 base-url 不要包含 /v1
spring.ai.openai.base-url=${LLM_BASE_URL:http://m.njuics.cn}
spring.ai.openai.chat.options.model=${LLM_MODEL}

# Embedding: 本地 ONNX 模型（all-MiniLM-L6-v2），无需远程 API
# spring-ai-starter-model-transformers 自动配置，使用默认模型即可
